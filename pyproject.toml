[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azhub"
version = "0.1.0"
description = "AZHub: Blank Key / neutral spatial container (AIH-WP-1.0). Not AZInterface. Author Aziel Eliab."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
  "azhub",
  "blank-key",
  "hub",
  "fraggate",
  "aih-wp-1.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
azhub = "azhub.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/azhub"
Download = "https://azhub-download-tracker.vibelock.workers.dev/download?asset=azhub-0.1.0.tar.gz"
Issues = "https://github.com/AzielEliab/azhub/issues"
Counted-downloads = "https://azhub-download-tracker.vibelock.workers.dev/"
Runtime = "https://aziel-runtime.vibelock.workers.dev/"
FragGate = "https://github.com/AzielEliab/fraggate"
Library = "https://www.azielcorpuslibrary.net/"
AZInterface = "https://github.com/AzielEliab/azinterface"
AZBrowser = "https://github.com/AzielEliab/azbrowser"
AZNet = "https://github.com/AzielEliab/aznet"
GodLock = "https://godlock.uk"
Author = "https://www.azieleliab.com"

[tool.setuptools.packages.find]
include = ["azhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
